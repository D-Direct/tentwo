<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Two — Luxury Residence, Kandy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3EEE3;
    --ink:#15140F;
    --gold:#AB8A46;
    --gold-light:#C9AD73;
    --muted:#8a8776;
    --muted-light:#9a9686;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .stage{
    text-align:center;
    max-width:560px;
    width:100%;
    animation:rise 1.1s ease both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .mark{
    display:inline-flex;
    align-items:center;
    gap:22px;
    margin-bottom:34px;
  }
  .mark .stack{ line-height:.92; text-align:right; }
  .mark .stack .l1{
    font-family:'Cormorant',serif;
    font-weight:400;
    font-size:clamp(34px, 8vw, 54px);
    letter-spacing:.1em;
    color:var(--cream);
  }
  .mark .stack .l2{
    font-family:'Cormorant',serif;
    font-weight:400;
    font-size:clamp(34px, 8vw, 54px);
    letter-spacing:.1em;
    color:var(--gold-light);
  }
  .mark .bar{
    width:1px;
    height:clamp(46px, 10vw, 70px);
    background:var(--gold);
  }
  .mark .desc{
    text-align:left;
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--cream);
    line-height:1.9;
  }
  .mark .desc .loc-line{
    color:var(--gold-light);
    display:block;
  }

  .rule{
    width:44px;
    height:1px;
    background:var(--gold);
    margin:0 auto 28px;
  }

  .status{
    font-family:'Cormorant',serif;
    font-size:clamp(18px, 3.5vw, 22px);
    font-style:italic;
    color:var(--cream);
    letter-spacing:.02em;
    margin-bottom:14px;
  }

  .note{
    font-size:12px;
    letter-spacing:.05em;
    color:var(--muted-light);
    line-height:1.8;
    max-width:380px;
    margin:0 auto 40px;
  }

  .contact{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--cream);
  }
  .contact a{
    color:var(--cream);
    text-decoration:none;
    border-bottom:1px solid var(--gold);
    padding-bottom:2px;
    transition:color .25s ease, border-color .25s ease;
  }
  .contact a:hover{
    color:var(--gold-light);
    border-color:var(--gold-light);
  }

  .footer-loc{
    margin-top:52px;
    font-size:10px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted-light);
  }

  @media (max-width:420px){
    .mark{gap:14px;}
    .mark .desc{font-size:9.5px; letter-spacing:.22em;}
  }

  @media (prefers-reduced-motion: reduce){
    .stage{animation:none;}
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="mark">
      <div class="stack">
        <div class="l1">TEN</div>
        <div class="l2">TWO</div>
      </div>
      <div class="bar"></div>
      <div class="desc">Luxury<br>Residence</div>
    </div>

    <div class="rule"></div>

    <div class="status">Something exceptional is on its way</div>
    <p class="note">Our website is currently being built. In the meantime, reach out directly for reservations and enquiries.</p>

    <div class="contact">
      <a href="mailto:reservations@tentwo.lk">reservations@tentwo.lk</a>
    </div>

    <div class="footer-loc">Kandy, Sri Lanka</div>
  </div>

</body>
</html>
